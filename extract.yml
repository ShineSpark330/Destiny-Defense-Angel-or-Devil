name: Extract os.7z

on:
  push:
    paths: [ "os.7z" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Extract os.7z into project/
        run: |
          rm -rf project
          mkdir project
          7z x os.7z -oproject -y
          # If the archive wraps everything in a single folder, flatten it
          if [ ! -f project/apktool.yml ]; then
            yml=$(find project -name apktool.yml | head -n 1)
            if [ -z "$yml" ]; then
              echo "apktool.yml not found inside os.7z" >&2
              exit 1
            fi
            dir=$(dirname "$yml")
            mv "$dir" project_tmp
            rm -rf project
            mv project_tmp project
          fi

      - name: Commit extracted project
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A project
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Extract os.7z into project/"
            git push
          fi
